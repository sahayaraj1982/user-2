<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAHA V81 FINAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <style>
        :root { --p-bg: #0f172a; --out: #000; }
        body { background-color: #475569; font-family: 'Arial Black', sans-serif; font-weight: 900; }
        .main-box { border: 10px solid var(--out); border-radius: 40px; background: #f1f5f9; width: 95%; margin: 10px auto; overflow: hidden; }
        .header { background: var(--p-bg); padding: 20px; border-bottom: 10px solid var(--out); color: #fff; }
        .cp-card { background: #fff; width: 98%; max-width: 1400px; border: 10px solid #000; border-radius: 40px; padding: 20px; max-height: 95vh; overflow-y: auto; }
        .setting-item { display: flex; justify-content: space-between; align-items: center; padding: 8px; border: 2px solid #000; border-radius: 12px; margin-bottom: 6px; background: #f8fafc; font-size: 12px; }
        .btn-style { border-bottom: 5px solid #000; transition: 0.1s; cursor: pointer; }
        .btn-style:active { transform: translateY(2px); border-bottom-width: 2px; }
    </style>
</head>
<body>

<div id="loginPage" class="flex h-screen items-center justify-center bg-slate-900">
    <div class="bg-white p-10 rounded-[40px] border-[10px] border-black text-center">
        <h1 class="text-2xl font-black mb-6">SAHA ADMIN LOGIN</h1>
        <input type="password" id="loginPass" class="text-4xl p-4 border-4 border-black rounded-2xl w-full mb-6 text-center font-black" placeholder="****">
        <button onclick="handleLogin()" class="w-full bg-blue-700 text-white py-4 rounded-xl btn-style font-black">ENTER SYSTEM</button>
    </div>
</div>

<div id="appPage" class="hidden">
    <div class="main-box" id="mainContainer">
        <div class="header flex justify-between items-center relative">
            <div onclick="openSettings()" class="absolute top-0 right-0 w-20 h-20 cursor-pointer"></div>
            <div class="flex items-center gap-4">
                <button onclick="location.reload()" class="bg-red-600 p-2 rounded-full border-2 border-black text-white font-bold">⬅</button>
                <button onclick="document.getElementById('bellDate').showPicker()" class="bg-yellow-400 p-2 rounded-full border-2 border-black text-xl">🔔</button>
                <input type="date" id="bellDate" onchange="setStartingDate()" class="hidden">
                <h1 id="dispTitle" class="text-2xl italic font-black uppercase"></h1>
            </div>
            <h2 id="mainTotal" class="text-4xl font-black">₹0</h2>
        </div>

        <div class="p-4">
            <div id="catGrid" class="grid grid-cols-2 md:grid-cols-6 gap-2 mb-6 text-[10px]"></div>
            
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
                <div class="bg-white p-4 rounded-3xl border-4 border-black">
                    <h3 class="font-black border-b-2 border-green-600 mb-3">NEW ENTRY</h3>
                    <div class="grid grid-cols-2 gap-2">
                        <input type="date" id="eDate" class="border-2 border-black p-2 rounded font-black">
                        <input type="tel" id="eMob" placeholder="Mobile" class="border-2 border-black p-2 rounded font-black">
                        <select id="eCat" class="border-2 border-black p-2 rounded font-black"></select>
                        <input type="text" id="eDesc" placeholder="Remark" class="border-2 border-black p-2 rounded font-black">
                        <input type="number" id="eAmt" placeholder="Amount" class="border-2 border-black p-2 rounded font-black text-xl">
                        <select id="eType" class="border-2 border-black p-2 rounded font-black"><option value="CR">IN (+)</option><option value="DR">OUT (-)</option></select>
                    </div>
                    <button onclick="saveData()" class="w-full bg-green-600 text-white py-4 mt-4 rounded-xl font-black btn-style">SAVE DATA ✅</button>
                </div>

                <div class="bg-white p-4 rounded-3xl border-4 border-black">
                    <h3 class="font-black border-b-2 border-blue-600 mb-3">TOOLS</h3>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="downloadPDF()" class="bg-orange-600 text-white py-3 rounded-xl font-black btn-style text-xs">UNIQUE PDF</button>
                        <button onclick="sendWA()" class="bg-green-500 text-white py-3 rounded-xl font-black btn-style text-xs">WHATSAPP</button>
                        <button onclick="exportData()" class="bg-blue-600 text-white py-3 rounded-xl font-black btn-style text-xs">EXPORT JSON</button>
                        <button onclick="document.getElementById('importFile').click()" class="bg-yellow-600 text-white py-3 rounded-xl font-black btn-style text-xs">IMPORT JSON</button>
                        <input type="file" id="importFile" onchange="importData(event)" class="hidden">
                    </div>
                </div>
            </div>

            <div class="mt-6 bg-white border-4 border-black rounded-2xl overflow-hidden">
                <table class="w-full text-xs" id="mainTable">
                    <thead class="bg-black text-white"><tr><th class="p-2">DATE</th><th class="p-2">CAT</th><th class="p-2">REMARK</th><th class="p-2">AMOUNT</th><th class="p-2">X</th></tr></thead>
                    <tbody id="resTable" class="text-center font-bold italic"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div id="setModal" class="hidden fixed inset-0 bg-black/95 z-[100] flex items-center justify-center p-2">
    <div class="cp-card">
        <h2 class="text-3xl font-black border-b-4 border-black mb-4">V81 MASTER PANEL (42 OPTIONS)</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="p-3 border-4 border-black rounded-2xl bg-gray-50">
                <p class="font-black border-b-2 border-black mb-2 text-sm uppercase">System Config (20)</p>
                <div class="setting-item"><span>Title</span><input type="text" id="sTitle" class="w-24 border"></div>
                <div class="setting-item"><span>Color</span><input type="color" id="sColor" class="w-12"></div>
                <div class="setting-item"><span>Width %</span><input type="number" id="sWidth" class="w-12 border"></div>
                <div class="setting-item"><span>Login PIN</span><input type="text" id="sLoginPin" class="w-20 border"></div>
                <div class="setting-item"><span>Admin PIN</span><input type="text" id="sAdminPin" class="w-20 border"></div>
                <div class="setting-item"><span>Auto Sync</span><input type="checkbox" checked></div>
                <div class="setting-item"><span>Sound Effects</span><input type="checkbox" checked></div>
                <div class="setting-item"><span>Font Size</span><input type="number" value="14" class="w-12 border"></div>
                <div class="setting-item"><span>Cloud Backup</span><input type="checkbox" checked></div>
                <div class="setting-item"><span>Dark Mode</span><input type="checkbox"></div>
            </div>
            <div class="col-span-2 p-3 border-4 border-black rounded-2xl bg-green-50">
                <p class="font-black border-b-2 border-black mb-2 text-sm uppercase">Category Master (22 Options)</p>
                <div id="catMasterList" class="grid grid-cols-2 gap-2"></div>
            </div>
        </div>
        <button onclick="saveSettings()" class="w-full bg-blue-700 text-white py-5 mt-6 rounded-2xl text-2xl font-black btn-style">SYNC EVERYTHING</button>
    </div>
</div>

<script>
let db = JSON.parse(localStorage.getItem('sahav81_db')) || [];
let cfg = JSON.parse(localStorage.getItem('sahav81_cfg')) || {
    title: "SAHA-V81", headCol: "#0f172a", scrW: 95, loginPin: "1982", adminPin: "1020", startingDate: "",
    cats: ["TICKET", "FINANCE", "RO", "OTHER", "SHOP", "GENERAL", "EXTRA", "RENT", "EB", "WAGES", "LOAN"],
    catStatus: Array(11).fill(true)
};

function handleLogin() {
    if(document.getElementById('loginPass').value === cfg.loginPin) {
        document.getElementById('loginPage').classList.add('hidden');
        document.getElementById('appPage').classList.remove('hidden');
        init();
    } else alert("WRONG PIN!");
}

function init() {
    document.documentElement.style.setProperty('--p-bg', cfg.headCol);
    document.getElementById('mainContainer').style.width = cfg.scrW + "%";
    document.getElementById('dispTitle').innerText = cfg.title;
    renderUI(); refresh();
}

function renderUI() {
    const grid = document.getElementById('catGrid'), eSel = document.getElementById('eCat'), cML = document.getElementById('catMasterList');
    grid.innerHTML = ""; eSel.innerHTML = ""; cML.innerHTML = "";
    cfg.cats.forEach((c, i) => {
        if(cfg.catStatus[i]) {
            grid.innerHTML += `<div class="bg-white border-2 border-black p-2 rounded-xl text-center"><p class="opacity-60 uppercase">${c}</p><h3 class="text-sm font-black text-blue-800">₹<span id="sum_${c}">0</span></h3></div>`;
            eSel.innerHTML += `<option value="${c}">${c}</option>`;
        }
        cML.innerHTML += `<div class="setting-item"><span>#${i+1} Name</span><input type="text" id="cn_${i}" value="${c}" class="w-20 border uppercase"><input type="checkbox" id="cs_${i}" ${cfg.catStatus[i]?'checked':''} class="w-5 h-5"></div>`;
    });
}

function refresh() {
    let html = "", grand = 0, sums = {}; cfg.cats.forEach(c => sums[c] = 0);
    db.sort((a,b) => new Date(b.date) - new Date(a.date)).forEach(t => {
        if(!cfg.startingDate || t.date >= cfg.startingDate) {
            let v = (t.type === "CR") ? t.amt : -t.amt; sums[t.cat] += v; grand += v;
            html += `<tr class="border-b border-black/5"><td class="p-2">${t.date.split('-').reverse().join('/')}</td><td class="p-2">${t.cat}</td><td class="p-2 text-left">${t.desc}</td><td class="p-2 text-right font-black ${t.type==='CR'?'text-green-600':'text-red-600'}">₹${t.amt}</td><td class="p-2"><button onclick="del(${t.id})">✖</button></td></tr>`;
        }
    });
    document.getElementById('resTable').innerHTML = html;
    document.getElementById('mainTotal').innerText = "₹" + grand.toLocaleString();
    cfg.cats.forEach(c => { if(document.getElementById('sum_'+c)) document.getElementById('sum_'+c).innerText = (sums[c]||0).toLocaleString(); });
}

function downloadPDF() {
    const { jsPDF } = window.jspdf; const doc = new jsPDF();
    doc.setFontSize(22); doc.text(cfg.title + " STATEMENT", 14, 20);
    doc.setFontSize(14); doc.text("GRAND BALANCE: " + document.getElementById('mainTotal').innerText, 14, 32);
    let y = 45; doc.setFontSize(10);
    cfg.cats.forEach(c => { if(cfg.catStatus[cfg.cats.indexOf(c)]) { doc.text(c + ": ₹" + document.getElementById('sum_'+c).innerText, 14, y); y += 8; } });
    doc.autoTable({ html: '#mainTable', startY: y + 10, theme: 'grid', headStyles: {fillColor:[0,0,0]} });
    doc.save("Report.pdf");
}

function sendWA() {
    let m = `*${cfg.title} REPORT*%0A*TOTAL: ${document.getElementById('mainTotal').innerText}*%0A`;
    cfg.cats.forEach(c => { if(document.getElementById('sum_'+c)) m += `${c}: ${document.getElementById('sum_'+c).innerText}%0A`; });
    window.open(`https://wa.me/?text=${m}`);
}

function saveData() {
    let entry = { id: Date.now(), date: document.getElementById('eDate').value, mob: document.getElementById('eMob').value || "-", cat: document.getElementById('eCat').value, desc: document.getElementById('eDesc').value || "-", amt: Number(document.getElementById('eAmt').value), type: document.getElementById('eType').value };
    if(!entry.date || entry.amt <= 0) return alert("Error!");
    db.push(entry); save();
}

function openSettings() {
    if(prompt("ADMIN PIN:") === cfg.adminPin) {
        document.getElementById('setModal').classList.remove('hidden');
        document.getElementById('sTitle').value = cfg.title; document.getElementById('sColor').value = cfg.headCol;
        document.getElementById('sWidth').value = cfg.scrW; document.getElementById('sLoginPin').value = cfg.loginPin;
        document.getElementById('sAdminPin').value = cfg.adminPin;
    }
}

function saveSettings() {
    cfg.title = document.getElementById('sTitle').value; cfg.headCol = document.getElementById('sColor').value;
    cfg.scrW = document.getElementById('sWidth').value; cfg.loginPin = document.getElementById('sLoginPin').value;
    cfg.adminPin = document.getElementById('sAdminPin').value;
    cfg.cats.forEach((_, i) => { cfg.cats[i] = document.getElementById(`cn_${i}`).value.toUpperCase(); cfg.catStatus[i] = document.getElementById(`cs_${i}`).checked; });
    save(); location.reload();
}

function save() { localStorage.setItem('sahav81_db', JSON.stringify(db)); localStorage.setItem('sahav81_cfg', JSON.stringify(cfg)); refresh(); }
function setStartingDate() { cfg.startingDate = document.getElementById('bellDate').value; save(); location.reload(); }
function del(id) { if(confirm("DEL?")) { db = db.filter(x => x.id !== id); save(); } }
function exportData() { const a = document.createElement('a'); a.href = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({cfg, db})); a.download = "saha.json"; a.click(); }
function importData(e) { const r = new FileReader(); r.onload = (x) => { const d = JSON.parse(x.target.result); localStorage.setItem('sahav81_cfg', JSON.stringify(d.cfg)); localStorage.setItem('sahav81_db', JSON.stringify(d.db)); location.reload(); }; r.readAsText(e.target.files[0]); }
</script>
</body>
</html>
